<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reza Quran Bot Dashboard</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',sans-serif;background:#0a0a12;color:#e0e0e0;min-height:100vh}
    header{background:linear-gradient(135deg,#0d1b2a,#1b2a3b);padding:20px 30px;border-bottom:2px solid#c9a84c;display:flex;align-items:center;justify-content:space-between}
    header h1{font-size:22px;color:#fff}
    header span{font-size:12px;color:#888}
    .container{max-width:900px;margin:0 auto;padding:24px 16px}
    .stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
    .stat-card{background:#111827;border:1px solid#1f2937;border-radius:12px;padding:20px;text-align:center}
    .stat-card .num{font-size:36px;font-weight:bold}
    .stat-card .label{font-size:12px;color:#888;margin-top:4px}
    .num-gold{color:#c9a84c}.num-green{color:#4caf50}.num-blue{color:#3b82f6}

    .trigger-box{background:#111827;border:1px solid#1f2937;border-radius:12px;padding:20px;margin-bottom:20px}
    .trigger-box h3{margin-bottom:12px;font-size:14px;color:#aaa}
    .run-btn{width:100%;padding:14px;background:linear-gradient(135deg,#c9a84c,#a07830);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer}
    .run-btn:hover{opacity:0.9}.run-btn:disabled{opacity:0.5;cursor:not-allowed}

    .status-bar{background:#111827;border:1px solid#1f2937;border-radius:10px;padding:12px 16px;margin-bottom:20px;font-size:13px;color:#aaa;min-height:44px}
    .status-bar.running{border-color:#ffc107;color:#ffc107}
    .status-bar.success{border-color:#4caf50;color:#4caf50}
    .status-bar.error{border-color:#f44336;color:#f44336}

    .section{background:#111827;border:1px solid#1f2937;border-radius:12px;margin-bottom:20px;overflow:hidden}
    .section-header{padding:14px 20px;background:#0d1b2a;font-weight:bold;font-size:14px;border-bottom:1px solid#1f2937}

    .progress-card{padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
    .progress-info{font-size:14px}
    .progress-info span{color:#c9a84c;font-weight:bold}

    .post-item{padding:12px 20px;border-bottom:1px solid#1a2030;font-size:13px;display:flex;justify-content:space-between;align-items:center}
    .post-item:last-child{border-bottom:none}
    .badge{display:inline-block;padding:3px 8px;border-radius:10px;font-size:11px;font-weight:bold}
    .badge-short{background:#1a2a4a;color:#3b82f6}
    .badge-long{background:#2a1a4a;color:#8b5cf6}
    .badge-ok{background:#1a4a2e;color:#4caf50}
    .badge-fail{background:#4a1a1a;color:#f44336}

    .run-item{padding:14px 20px;border-bottom:1px solid#1a2030;cursor:pointer}
    .run-item:last-child{border-bottom:none}
    .run-item:hover{background:#1a2030}
    .run-logs{display:none;margin-top:10px;background:#050510;border-radius:8px;padding:10px;font-family:monospace;font-size:11px;color:#aaa;line-height:1.8;max-height:250px;overflow-y:auto;white-space:pre-wrap}
    .run-logs.open{display:block}
    .log-ok{color:#4caf50}.log-err{color:#f44336}.log-warn{color:#ffc107}
    .empty{padding:24px;text-align:center;color:#555;font-size:13px}
    .refresh-btn{background:#111827;border:1px solid#1f2937;color:#aaa;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;margin-bottom:16px}
    .refresh-btn:hover{border-color:#c9a84c;color:#c9a84c}
  </style>
</head>
<body>
<header>
  <h1>🕌 Reza Quran Recitation Bot</h1>
  <span id="last-refresh">Loading...</span>
</header>
<div class="container">

  <div class="stats-row">
    <div class="stat-card">
      <div class="num num-gold" id="current-surah">—</div>
      <div class="label">Current Surah</div>
    </div>
    <div class="stat-card">
      <div class="num num-green" id="total-videos">—</div>
      <div class="label">Videos Generated</div>
    </div>
    <div class="stat-card">
      <div class="num num-blue" id="total-runs">—</div>
      <div class="label">Total Runs</div>
    </div>
  </div>

  <div class="trigger-box">
    <h3>🎙️ Generate Today's Quran Videos</h3>
    <button class="run-btn" id="run-btn" onclick="triggerBot()">▶ Generate & Send to Telegram</button>
  </div>

  <div class="status-bar" id="status-bar">Idle — click Generate to create videos</div>

  <button class="refresh-btn" onclick="loadDashboard()">⟳ Refresh</button>

  <div class="section">
    <div class="section-header">📖 Current Progress</div>
    <div id="progress-info"><div class="empty">Loading...</div></div>
  </div>

  <div class="section">
    <div class="section-header">🎬 Recent Videos Generated</div>
    <div id="posts-list"><div class="empty">Loading...</div></div>
  </div>

  <div class="section">
    <div class="section-header">📋 Run History (click to expand logs)</div>
    <div id="runs-list"><div class="empty">Loading...</div></div>
  </div>

</div>
<script>
const BASE = window.location.origin;
const SURAHS = ["Al-Fatiha","Al-Baqarah","Al-Imran","An-Nisa","Al-Maidah","Al-An'am","Al-A'raf","Al-Anfal","At-Tawbah","Yunus","Hud","Yusuf","Ar-Ra'd","Ibrahim","Al-Hijr","An-Nahl","Al-Isra","Al-Kahf","Maryam","Ta-Ha","Al-Anbya","Al-Hajj","Al-Mu'minun","An-Nur","Al-Furqan","Ash-Shu'ara","An-Naml","Al-Qasas","Al-Ankabut","Ar-Rum","Luqman","As-Sajdah","Al-Ahzab","Saba","Fatir","Ya-Sin","As-Saffat","Sad","Az-Zumar","Ghafir","Fussilat","Ash-Shura","Az-Zukhruf","Ad-Dukhan","Al-Jathiyah","Al-Ahqaf","Muhammad","Al-Fath","Al-Hujurat","Qaf","Adh-Dhariyat","At-Tur","An-Najm","Al-Qamar","Ar-Rahman","Al-Waqi'ah","Al-Hadid","Al-Mujadila","Al-Hashr","Al-Mumtahanah","As-Saf","Al-Jumu'ah","Al-Munafiqun","At-Taghabun","At-Talaq","At-Tahrim","Al-Mulk","Al-Qalam","Al-Haqqah","Al-Ma'arij","Nuh","Al-Jinn","Al-Muzzammil","Al-Muddaththir","Al-Qiyamah","Al-Insan","Al-Mursalat","An-Naba","An-Nazi'at","Abasa","At-Takwir","Al-Infitar","Al-Mutaffifin","Al-Inshiqaq","Al-Buruj","At-Tariq","Al-A'la","Al-Ghashiyah","Al-Fajr","Al-Balad","Ash-Shams","Al-Layl","Ad-Duhaa","Ash-Sharh","At-Tin","Al-Alaq","Al-Qadr","Al-Bayyinah","Az-Zalzalah","Al-Adiyat","Al-Qari'ah","At-Takathur","Al-Asr","Al-Humazah","Al-Fil","Quraysh","Al-Ma'un","Al-Kawthar","Al-Kafirun","An-Nasr","Al-Masad","Al-Ikhlas","Al-Falaq","An-Nas"];

function formatTime(iso){return new Date(iso).toLocaleString("en-IN",{timeZone:"Asia/Dhaka",hour12:true})}
function colorLog(l){if(l.includes("✅"))return`<span class="log-ok">${l}</span>`;if(l.includes("❌"))return`<span class="log-err">${l}</span>`;if(l.includes("⚠️"))return`<span class="log-warn">${l}</span>`;return l}
function toggleLogs(i){document.getElementById("logs-"+i).classList.toggle("open")}

async function loadDashboard(){
  document.getElementById("last-refresh").textContent="Refreshing...";
  try{
    const[logsRes,postsRes,progRes]=await Promise.all([
      fetch(`${BASE}/api/logs`).then(r=>r.json()),
      fetch(`${BASE}/api/posts`).then(r=>r.json()),
      fetch(`${BASE}/api/progress`).then(r=>r.json()),
    ]);

    const runs=logsRes.runs||[];
    const posts=postsRes.posts||[];
    const prog=progRes.progress||{surah:1};

    document.getElementById("current-surah").textContent=prog.surah;
    document.getElementById("total-videos").textContent=posts.length;
    document.getElementById("total-runs").textContent=runs.length;

    // Progress
    const surahName=SURAHS[prog.surah-1]||`Surah ${prog.surah}`;
    document.getElementById("progress-info").innerHTML=`
      <div class="progress-card">
        <div class="progress-info">
          Next to generate: <span>Surah ${prog.surah} - ${surahName}</span>
        </div>
        <div class="progress-info">
          Ayah: <span>${prog.ayah}</span>
        </div>
      </div>`;

    // Posts
    const postsList=document.getElementById("posts-list");
    if(!posts.length){postsList.innerHTML=`<div class="empty">No videos generated yet</div>`}
    else{postsList.innerHTML=posts.map(p=>`
      <div class="post-item">
        <div>
          <span class="badge ${p.type==='short'?'badge-short':'badge-long'}">${p.type==='short'?'📱 Short':'🎬 Long'}</span>
          &nbsp; Surah ${p.surah} - ${SURAHS[parseInt(p.surah)-1]||''} (Ayah ${p.ayahStart}-${p.ayahEnd})
        </div>
        <span style="font-size:11px;color:#555">${formatTime(p.createdAt)}</span>
      </div>`).join("")}

    // Runs
    const runsList=document.getElementById("runs-list");
    if(!runs.length){runsList.innerHTML=`<div class="empty">No runs yet</div>`}
    else{runsList.innerHTML=runs.map((run,i)=>`
      <div class="run-item" onclick="toggleLogs(${i})">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;flex-wrap:wrap;gap:6px">
          <span style="font-size:12px;color:#aaa">🕐 ${formatTime(run.timestamp)}</span>
          <span class="badge ${run.status==='success'?'badge-ok':'badge-fail'}">${run.status==='success'?'✅ Success':'⚠️ Partial'}</span>
        </div>
        <div id="logs-${i}" class="run-logs">${(run.logs||[]).map(colorLog).join("\n")}</div>
      </div>`).join("")}

    document.getElementById("last-refresh").textContent=`Last refresh: ${new Date().toLocaleTimeString()}`;
  }catch(err){document.getElementById("last-refresh").textContent="Refresh failed"}
}

async function triggerBot(){
  const btn=document.getElementById("run-btn");
  const statusBar=document.getElementById("status-bar");
  btn.disabled=true;btn.textContent="⏳ Generating...";
  statusBar.className="status-bar running";
  statusBar.textContent="🔄 Generating Quran videos... this takes 10-30 minutes. Check Telegram!";
  try{
    await fetch(`${BASE}/api/run`);
    statusBar.textContent="✅ Bot started! Videos will appear in Telegram when ready.";
    statusBar.className="status-bar success";
    setTimeout(loadDashboard,5*60*1000);
  }catch(err){
    statusBar.className="status-bar error";
    statusBar.textContent=`❌ Failed: ${err.message}`;
  }
  btn.disabled=false;btn.textContent="▶ Generate & Send to Telegram";
}

loadDashboard();
setInterval(loadDashboard,5*60*1000);
</script>
</body>
</html>
